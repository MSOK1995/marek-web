  <p>Wir erstellen die Inhalte dieser Website mit größtmöglicher Sorgfalt, übernehmen jedoch keine Gewähr für ihre Richtigkeit, Vollständigkeit und Aktualität. Für die Inhalte verlinkter externer Seiten sind ausschließlich deren Betreiber verantwortlich; zum Zeitpunkt der Verlinkung waren keine Rechtsverstöße erkennbar. Bei Bekanntwerden von Rechtsverletzungen entfernen wir derartige Links umgehend.</p>
  <h2>Datenschutz:</h2>
  <p>Informationen zur Verarbeitung Ihrer personenbezogenen Daten und zu Ihren Rechten finden Sie in unserer <a href="/datenschutz">Datenschutzerklärung</a>.</p>
  <h2>Streitschlichtung:</h2>
