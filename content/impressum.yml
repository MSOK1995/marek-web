title: Impressum
description: Impressum – The Chiropractor Wien, Joanelligasse 10/11, 1060 Wien.
body: |-
  <h2>Medieninhaber, Herausgeber und Betreiber dieser Website (§ 5 ECG, § 24 Mediengesetz):</h2>
  <p>The Chiropractor Wien<br>Marek Sukenik<br>Meine Steuernummer: 03 452/2797</p>
  <p>Joanelligasse 10/11<br>1060 Wien, Österreich</p>
  <h2>Berufsbezeichnung und berufsrechtliche Angaben:</h2>
  <p>Der Inhaber ist freiberuflich tätiger Physiotherapeut mit Registrierung im Gesundheitsberuferegister (<a href="https://gbr-public.ehealth.gv.at/" target="_blank" rel="noopener">https://gbr-public.ehealth.gv.at/</a>), Registrierungsnummer: 19-GBR-080590.</p>
  <p>Akademische Grade: Magister (Mgr.) der Physiotherapie, Slowakische Medizinische Universität in Bratislava; Master of Science (MSc) in Chiropraktik, Chiropraktik Campus Hamburg.</p>
  <p>Alle weiteren Ausbildungen und Kurse finden Sie auf der Seite <a href="/uber-uns#ausbildung">Über Uns</a>.</p>
  <p>Berufsrechtliche Vorschriften: MTD-Gesetz 2024, abrufbar im Rechtsinformationssystem des Bundes unter <a href="https://www.ris.bka.gv.at/" target="_blank" rel="noopener">www.ris.bka.gv.at</a>.</p>
  <h2>Kontakt:</h2>
  <p>Tel.: +43 660 6276758<br>E-Mail: info@thechiropractor.at</p>
  <p>Bei Fragen zu dieser Website oder zu unserem Angebot erreichen Sie uns telefonisch oder per E-Mail.</p>
  <h2>Offenlegung gemäß § 25 Mediengesetz:</h2>
  <p>Unternehmensgegenstand: Physiotherapie und Chiropraktik.<br>Grundlegende Richtung der Website: Information über das Leistungsangebot der Praxis The Chiropractor Wien.</p>
  <h2>Medizinischer Hinweis:</h2>
  <p>Die Inhalte dieser Website dienen ausschließlich der allgemeinen Information. Sie ersetzen keine ärztliche Untersuchung, Diagnose oder Behandlung. Bei gesundheitlichen Beschwerden wenden Sie sich bitte an eine Ärztin oder einen Arzt.</p>
  <h2>Haftung für Inhalte und Links:</h2>
  <p>Wir erstellen die Inhalte dieser Website mit größtmöglicher Sorgfalt, übernehmen jedoch keine Gewähr für ihre Richtigkeit, Vollständigkeit und Aktualität. Für die Inhalte verlinkter externer Seiten sind ausschließlich deren Betreiber verantwortlich; zum Zeitpunkt der Verlinkung waren keine Rechtsverstöße erkennbar. Bei Bekanntwerden von Rechtsverletzungen entfernen wir derartige Links umgehend.</p>
  <h2>Datenschutz:</h2>
  <p>Informationen zur Verarbeitung Ihrer personenbezogenen Daten und zu Ihren Rechten finden Sie in unserer <a href="/datenschutz">Datenschutzerklärung</a>.</p>
  <h2>Streitschlichtung:</h2>
  <p>Wir sind nicht bereit oder verpflichtet, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.</p>
