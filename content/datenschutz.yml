title: Datenschutzerklärung
description: Datenschutzerklärung – The Chiropractor Wien.
body: |-
  <h2>1. Datenschutz auf einen Blick</h2>
  <p><b>Allgemeine Hinweise</b></p>
  <p>Die folgenden Hinweise geben einen einfachen Überblick darüber, was mit Ihren personenbezogenen Daten passiert, wenn Sie unsere Website besuchen. Personenbezogene Daten sind alle Daten, mit denen Sie persönlich identifiziert werden können. Ausführliche Informationen zum Thema Datenschutz entnehmen Sie unserer unter diesem Text aufgeführten Datenschutzerklärung.</p>
  <p>Datenerfassung auf unserer Website</p>
  <p><strong>Wer ist verantwortlich für die Datenerfassung auf dieser Website?</strong></p>
  <p>Die Datenverarbeitung auf dieser Website erfolgt durch den Websitebetreiber. Dessen Kontaktdaten können Sie dem Impressum dieser Website entnehmen.</p>
  <p><strong>Wie erfassen wir Ihre Daten?</strong></p>
  <p>Ihre Daten werden zum einen dadurch erhoben, dass Sie uns diese mitteilen. Hierbei kann es sich z.B. um Daten handeln, die Sie uns per E-Mail oder Telefon mitteilen oder bei der Online-Terminbuchung angeben.</p>
  <p>Andere Daten werden automatisch beim Besuch der Website durch unsere IT-Systeme erfasst. Das sind vor allem technische Daten (z.B. Internetbrowser, Betriebssystem oder Uhrzeit des Seitenaufrufs). Die Erfassung dieser Daten erfolgt automatisch, sobald Sie unsere Website betreten.</p>
  <p><strong>Wofür nutzen wir Ihre Daten?</strong></p>
  <p>Ein Teil der Daten wird erhoben, um eine fehlerfreie Bereitstellung der Website zu gewährleisten. Eine Analyse Ihres Nutzerverhaltens findet auf dieser Website nicht statt.</p>
  <p><strong>Welche Rechte haben Sie bezüglich Ihrer Daten?</strong></p>
  <p>Sie haben jederzeit das Recht unentgeltlich Auskunft über Herkunft, Empfänger und Zweck Ihrer gespeicherten personenbezogenen Daten zu erhalten. Sie haben außerdem ein Recht, die Berichtigung, Sperrung oder Löschung dieser Daten zu verlangen. Hierzu sowie zu weiteren Fragen zum Thema Datenschutz können Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden. Des Weiteren steht Ihnen ein Beschwerderecht bei der zuständigen Aufsichtsbehörde zu.</p>
  <h2><b>2. Allgemeine Hinweise und Pflichtinformationen</b></h2>
  <p><b>Datenschutz</b></p>
  <p>Die Betreiber dieser Seiten nehmen den Schutz Ihrer persönlichen Daten sehr ernst. Wir behandeln Ihre personenbezogenen Daten vertraulich und entsprechend der gesetzlichen Datenschutzvorschriften sowie dieser Datenschutzerklärung.</p>
  <p>Wenn Sie diese Website benutzen, werden verschiedene personenbezogene Daten erhoben. Personenbezogene Daten sind Daten, mit denen Sie persönlich identifiziert werden können. Die vorliegende Datenschutzerklärung erläutert, welche Daten wir erheben und wofür wir sie nutzen. Sie erläutert auch, wie und zu welchem Zweck das geschieht.</p>
  <p>Wir weisen darauf hin, dass die Datenübertragung im Internet (z.B. bei der Kommunikation per E-Mail) Sicherheitslücken aufweisen kann. Ein lückenloser Schutz der Daten vor dem Zugriff durch Dritte ist nicht möglich.</p>
  <p>Hinweis zur verantwortlichen Stelle</p>
  <p>Die verantwortliche Stelle für die Datenverarbeitung auf dieser Website ist:</p>
  <p>Mgr. Bc., Marek Sukenik</p>
  <p>The Chiropractor Wien</p>
  <p>Joanelligasse 10/11, 1060 Wien</p>
  <p>Tel.: +43 660 6276758</p>
  <p>Mail: info@thechiropractor.at</p>
  <p><br></p>
  <p>Verantwortliche Stelle ist die natürliche oder juristische Person, die allein oder gemeinsam mit anderen über die Zwecke und Mittel der Verarbeitung von personenbezogenen Daten (z.B. Namen, E-Mail-Adressen o. Ä.) entscheidet.</p>
  <p><b>Widerruf Ihrer Einwilligung zur Datenverarbeitung</b></p>
  <p>Viele Datenverarbeitungsvorgänge sind nur mit Ihrer ausdrücklichen Einwilligung möglich. Sie können eine bereits erteilte Einwilligung jederzeit widerrufen. Dazu reicht eine formlose Mitteilung per E-Mail an uns. Die Rechtmäßigkeit der bis zum Widerruf erfolgten Datenverarbeitung bleibt vom Widerruf unberührt.</p>
  <p><b>Beschwerderecht bei der zuständigen Aufsichtsbehörde</b></p>
  <p>Im Falle datenschutzrechtlicher Verstöße steht dem Betroffenen ein Beschwerderecht bei der zuständigen Aufsichtsbehörde zu. In Österreich ist dies die Österreichische Datenschutzbehörde, Barichgasse 40–42, 1030 Wien, <a href="https://www.dsb.gv.at/" target="_blank" rel="noopener">www.dsb.gv.at</a>.</p>
  <p><b>Recht auf Datenübertragbarkeit</b></p>
  <p>Sie haben das Recht, Daten, die wir auf Grundlage Ihrer Einwilligung oder in Erfüllung eines Vertrags automatisiert verarbeiten, an sich oder an einen Dritten in einem gängigen, maschinenlesbaren Format aushändigen zu lassen. Sofern Sie die direkte Übertragung der Daten an einen anderen Verantwortlichen verlangen, erfolgt dies nur, soweit es technisch machbar ist.</p>
  <p><b>SSL- bzw. TLS-Verschlüsselung</b></p>
  <p>Diese Seite nutzt aus Sicherheitsgründen und zum Schutz der Übertragung vertraulicher Inhalte, wie zum Beispiel Bestellungen oder Anfragen, die Sie an uns als Seitenbetreiber senden, eine SSL-bzw. TLS-Verschlüsselung. Eine verschlüsselte Verbindung erkennen Sie daran, dass die Adresszeile des Browsers von “http://” auf “https://” wechselt und an dem Schloss-Symbol in Ihrer Browserzeile.</p>
  <p>Wenn die SSL- bzw. TLS-Verschlüsselung aktiviert ist, können die Daten, die Sie an uns übermitteln, nicht von Dritten mitgelesen werden.</p>
  <p><b>Auskunft, Sperrung, Löschung</b></p>
  <p>Sie haben im Rahmen der geltenden gesetzlichen Bestimmungen jederzeit das Recht auf unentgeltliche Auskunft über Ihre gespeicherten personenbezogenen Daten, deren Herkunft und Empfänger und den Zweck der Datenverarbeitung und ggf. ein Recht auf Berichtigung, Sperrung oder Löschung dieser Daten. Hierzu sowie zu weiteren Fragen zum Thema personenbezogene Daten können Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden.</p>
  <p><b>Widerspruch gegen Werbe-Mails</b></p>
  <p>Der Nutzung von im Rahmen der Impressumspflicht veröffentlichten Kontaktdaten zur Übersendung von nicht ausdrücklich angeforderter Werbung und Informationsmaterialien wird hiermit widersprochen. Die Betreiber der Seiten behalten sich ausdrücklich rechtliche Schritte im Falle der unverlangten Zusendung von Werbeinformationen, etwa durch Spam-E-Mails, vor.</p>
  <h2><b>3. Datenerfassung auf unserer Website</b></h2>
  <p><b>Cookies und lokaler Speicher</b></p>
  <p>Diese Website setzt keine Cookies zu Analyse- oder Werbezwecken. Ihre Auswahl im Cookie-Hinweis wird im lokalen Speicher Ihres Browsers (localStorage) abgelegt, damit der Hinweis nicht bei jedem Seitenaufruf erneut erscheint. Diese Information verbleibt auf Ihrem Gerät und wird nicht an uns übertragen. Sie können sie jederzeit über die Einstellungen Ihres Browsers löschen.</p>
  <p>Die Speicherung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO. Wir haben ein berechtigtes Interesse daran, Ihre Auswahl zu berücksichtigen.</p>
  <p><b>Hosting und Server-Log-Dateien</b></p>
  <p>Diese Website wird bei Cloudflare, Inc., 101 Townsend St., San Francisco, CA 94107, USA gehostet. Beim Aufruf der Website erhebt und speichert der Anbieter automatisch Informationen in so genannten Server-Log-Dateien, die Ihr Browser automatisch übermittelt. Dies sind:</p>
  <ul>
  <li>Browsertyp und Browserversion</li>
  <li>verwendetes Betriebssystem</li>
  <li>Referrer URL</li>
  <li>Hostname des zugreifenden Rechners</li>
  <li>Uhrzeit der Serveranfrage</li>
  <li>IP-Adresse</li></ul>
  <p>Eine Zusammenführung dieser Daten mit anderen Datenquellen wird nicht vorgenommen.</p>
  <p>Grundlage für die Datenverarbeitung ist Art. 6 Abs. 1 lit. f DSGVO. Wir haben ein berechtigtes Interesse an einer technisch fehlerfreien, schnellen und sicheren Bereitstellung der Website. Cloudflare ist unter dem EU-US Data Privacy Framework zertifiziert; eine Übermittlung in die USA ist dadurch nach Art. 45 DSGVO zulässig. Weitere Informationen: <a href="https://www.cloudflare.com/de-de/privacypolicy/" target="_blank" rel="noopener">Datenschutzerklärung von Cloudflare</a>.</p>
  <p><b>Kontakt per E-Mail oder Telefon</b></p>
  <p>Wenn Sie uns per E-Mail oder Telefon kontaktieren, werden Ihre Angaben inklusive der von Ihnen angegebenen Kontaktdaten zwecks Bearbeitung der Anfrage und für den Fall von Anschlussfragen bei uns gespeichert. Diese Daten geben wir nicht ohne Ihre Einwilligung weiter.</p>
  <p>Die Verarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO, sofern Ihre Anfrage mit der Erfüllung eines Vertrags zusammenhängt oder zur Durchführung vorvertraglicher Maßnahmen erforderlich ist, und im Übrigen auf Grundlage unseres berechtigten Interesses an der Bearbeitung Ihrer Anfrage (Art. 6 Abs. 1 lit. f DSGVO). Die Daten verbleiben bei uns, bis Sie uns zur Löschung auffordern oder der Zweck für die Datenspeicherung entfällt (z.B. nach abgeschlossener Bearbeitung Ihrer Anfrage). Zwingende gesetzliche Bestimmungen – insbesondere Aufbewahrungsfristen – bleiben unberührt.</p>
  <p><b>Online-Terminbuchung</b></p>
  <p>Für die Online-Terminbuchung verlinken wir auf das Buchungsportal von Treatsoft (<a href="https://portal.treatsoft.at/" target="_blank" rel="noopener">portal.treatsoft.at</a>). Die Buchung erfolgt auf der Website von Treatsoft; die dort eingegebenen Daten (z.B. Name, Kontaktdaten, gewünschter Termin) werden zur Terminvereinbarung verarbeitet. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO. Ergänzend gelten die Datenschutzhinweise von Treatsoft.</p>
  <h2><b>4. Plugins und Tools</b></h2>
  <p><b>YouTube und Vimeo</b></p>
  <p>Auf unserer Website können Sie Videos der Plattformen YouTube (Anbieter: Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland) und Vimeo (Anbieter: Vimeo.com, Inc., 330 West 34th Street, 5th Floor, New York, NY 10001, USA) ansehen.</p>
  <p>Die Videos werden erst geladen, wenn Sie auf das Vorschaubild klicken. Vorher wird keine Verbindung zu YouTube oder Vimeo hergestellt. Nach dem Klick wird Ihre IP-Adresse an den jeweiligen Anbieter übertragen, und der Anbieter kann Cookies oder vergleichbare Technologien einsetzen. YouTube wird dabei im erweiterten Datenschutzmodus (youtube-nocookie.com) eingebunden, Vimeo mit der Einstellung „Do Not Track“. Eine Übermittlung in die USA ist möglich; beide Anbieter bzw. deren Muttergesellschaften sind unter dem EU-US Data Privacy Framework zertifiziert.</p>
  <p>Wenn Sie in Ihrem YouTube- oder Vimeo-Konto eingeloggt sind, kann der Anbieter Ihr Surfverhalten Ihrem persönlichen Profil zuordnen. Dies können Sie verhindern, indem Sie sich vorher ausloggen.</p>
  <p>Rechtsgrundlage ist Ihre Einwilligung durch den Klick auf das Video (Art. 6 Abs. 1 lit. a DSGVO). Weitere Informationen finden Sie in den Datenschutzerklärungen von <a href="https://policies.google.com/privacy?hl=de" target="_blank" rel="noopener">Google/YouTube</a> und <a href="https://vimeo.com/privacy" target="_blank" rel="noopener">Vimeo</a>.</p>
  <p><b>Schriftarten</b></p>
  <p>Die auf dieser Website verwendeten Schriftarten sind lokal auf unserem Server gespeichert. Beim Aufruf der Website wird keine Verbindung zu Servern von Google oder anderen Anbietern von Schriftarten hergestellt.</p>
  <p><b>Google Maps</b></p>
  <p>Auf der Kontaktseite verlinken wir auf unseren Standort bei Google Maps. Es ist keine Karte eingebunden; Daten werden an Google (Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland) erst übertragen, wenn Sie den Link anklicken und die Website von Google Maps öffnen. Dort gilt die <a href="https://policies.google.com/privacy?hl=de" target="_blank" rel="noopener">Datenschutzerklärung von Google</a>.</p>
  <p>Stand: September 2026</p>
