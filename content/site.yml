# "In 3 Schritten" – erscheint auf der Startseite und auf Erfahrungsberichte
steps:
  - title: Buche dir deinen Ersttermin
    text: Buche dir online deinen Ersttermin zu deiner Wunschzeit. Falls du keinen passenden Termin findest, melde dich gerne bei uns.
  - title: Komme zu uns in die Praxis
    text: Komme mit Neugier und Offenheit zu uns in die Praxis und wir schauen uns im Ersttermin deinen aktuellen Gesundheitszustand an und wie wir dir am besten helfen können.
  - title: Verändere nachhaltig deinen Gesund­heitszustand
    text: Freue dich darauf Schritt für Schritt zurück zu deiner Gesundheit zu kommen. Wir begleiten und unterstützen dich dabei auf deinem Weg zu mehr Lebensqualität.
