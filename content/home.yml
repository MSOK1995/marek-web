philosophy:
  label: Unsere Philosophie
  heading: Entfalte dein volles Potenzial.
  text: Die Chiropraktik ist ein ganzheitliches, manuelles Diagnose- und Behandlungskonzept, das die Ursachen von Beschwerden diagnostiziert. Ihr Ziel ist es, Funktions- und Bewegungsstörungen im Körper zu erkennen. Da unser Körper ein selbstheilender und selbstregulierender Organismus ist, unterstützen wir ihn mit unserer Behandlung in diesem natürlichen Prozess.

experience:
  heading: Erfahrung, Können und Wissen verbinden sich bei The Chiropractor Wien
  text: In unserer Praxis wollen wir das Bewusstsein fördern, dass der menschliche Körper als integraler Bestandteil der Natur ein lebendiger, selbstregulierender und selbstheilender Organismus ist. In unserer Arbeit fokussieren wir uns auf das Auffinden und Korrigieren von Störungen, die die natürlichen Funktionen des Körpers beeinträchtigen.

