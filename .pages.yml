# Pages CMS configuration – https://pagescms.org/docs/configuration/
# Rozhranie CMS je po slovensky, obsah webu (hodnoty v content/*.yml) ostáva po nemecky.
# Every save in the CMS is a commit to GitHub; the push triggers the deploy (.github/workflows/deploy.yml).
media:
  input: img
  output: /img
  extensions: [jpg, jpeg, png, webp, svg]

settings:
  content:
    merge: true

content:
  # ------------------------------------------------------------------ Všeobecné
  - name: site
    label: Všeobecné
    type: file
    path: content/site.yml
    fields:
      - { name: name, label: Názov praxe, type: string, required: true }
      - name: theme
        label: Farebná schéma
        type: select
        options:
          values:
            - { value: sand, label: Piesková (predvolená) }
            - { value: sky, label: Modrá }
            - { value: rose, label: Ružová }
      - { name: logo, label: Logo, type: image }
      - { name: logo_alt, label: Logo – alternatívny text, type: string }
      - { name: og_image, label: Náhľadový obrázok pre sociálne siete, type: image }
      - { name: booking_url, label: Odkaz na online rezerváciu, type: string, required: true }
      - { name: booking_label, label: Text tlačidla rezervácie, type: string }
      - { name: address, label: Adresa, type: string, description: Používa sa aj pre odkaz na Google Maps. }
      - { name: phone, label: Telefón, type: string }
      - { name: email, label: E-mail, type: string }
      - { name: gbr_number, label: Číslo v Gesundheitsberuferegister, type: string, description: 'Nezobrazuje sa na stránke, len v údajoch pre Google (JSON-LD). Napr. 19-GBR-080590.' }
      - name: same_as
        label: Profily na iných stránkach
        description: 'Celé odkazy na Google Business Profile, Facebook, Instagram, Herold, docfinder a pod. Nezobrazujú sa na stránke, Google z nich vie, že patria k tejto praxi.'
        type: string
        list: true
      - name: nav
        label: Hlavné menu
        type: object
        list: true
        fields:
          - { name: label, label: Text, type: string }
          - { name: url, label: Odkaz, type: string, description: "napr. /kontakt alebo /chiropraktik#justierung" }
          - { name: page, label: Stránka (na zvýraznenie v menu), type: string, description: "Len pri podstránkach: chiropraktik, uber-uns, erfahrungsberichte, kontakt" }
          - name: children
            label: Podmenu
            type: object
            list: true
            fields:
              - { name: label, label: Text, type: string }
              - { name: url, label: Odkaz, type: string }
      - name: footer_links
        label: Odkazy v pätičke
        type: object
        list: true
        fields:
          - { name: label, label: Text, type: string }
          - { name: url, label: Odkaz, type: string }
          - { name: page, label: Stránka (na zvýraznenie), type: string }
      - { name: copyright, label: Riadok s copyrightom, type: string }
      - name: associations
        label: Asociácie (logá v pätičke)
        type: object
        list: true
        fields:
          - { name: image, label: Logo, type: image }
          - { name: alt, label: Názov asociácie, type: string }
          - name: style
            label: Pozadie
            type: select
            options:
              values:
                - { value: light, label: Svetlé (pre tmavé logá) }
                - { value: dark, label: Tmavé (pre svetlé logá) }
      - name: steps
        label: 3 kroky (úvodná stránka + Erfahrungsberichte)
        type: object
        list: true
        fields:
          - { name: title, label: Nadpis, type: string }
          - { name: text, label: Text, type: text }

  # ------------------------------------------------------------------ Úvodná stránka
  - name: home
    label: Úvodná stránka
    type: file
    path: content/home.yml
    fields:
      - { name: title, label: Titulok stránky (karta prehliadača / Google), type: string }
      - { name: description, label: Popis pre Google, type: text }
      - name: hero
        label: Úvodná časť (karusel citátov)
        type: object
        fields:
          - name: slides
            label: Citáty
            type: object
            list: true
            fields:
              - { name: quote, label: Citát, type: text }
              - { name: author, label: Autor, type: string }
              - { name: image, label: Obrázok na pozadí, type: image }
              - { name: image_position, label: Výrez obrázka, type: string, description: "nepovinné, napr. 50% 30% (vodorovne zvisle)" }
              - { name: long, label: Dlhý citát (menšie písmo), type: boolean }
          - { name: heading, label: Nadpis vpravo, type: string }
          - { name: lead, label: Text vpravo, type: string }
      - name: philosophy
        label: Unsere Philosophie
        type: object
        fields:
          - { name: label, label: Malý nadpis, type: string }
          - { name: heading, label: Nadpis, type: string }
          - { name: text, label: Text, type: text }
      - name: experience
        label: Erfahrung, Können und Wissen
        type: object
        fields:
          - { name: heading, label: Nadpis, type: string }
          - { name: text, label: Text, type: text }
      - name: quote
        label: Citát (pás)
        type: object
        fields:
          - { name: show, label: Zobraziť, type: boolean }
          - { name: text, label: Citát, type: text }
          - { name: author, label: Autor, type: string }
      - name: chiro
        label: Chiropraktik vom Chiropraktor
        type: object
        fields:
          - { name: image, label: Obrázok, type: image }
          - { name: image_alt, label: Obrázok – alternatívny text, type: string }
          - { name: label, label: Malý nadpis, type: string }
          - { name: heading, label: Nadpis, type: string }
          - { name: text, label: Text, type: text }
          - { name: link_label, label: Text odkazu, type: string }
          - { name: link_url, label: Odkaz, type: string }
          - name: gallery
            label: Malé obrázky
            type: object
            list: true
            fields:
              - { name: image, label: Obrázok, type: image }
              - { name: alt, label: Alternatívny text, type: string }
      - { name: statement, label: Vyhlásenie (tmavý pás), type: text }
      - name: groups
        label: Životné situácie
        type: object
        fields:
          - { name: heading, label: Nadpis, type: string }
          - { name: items, label: Položky, type: string, list: true }
      - name: effects
        label: Pozitívne ovplyvňuje
        type: object
        fields:
          - { name: heading, label: Nadpis, type: string }
          - name: items
            label: Položky
            type: object
            list: true
            fields:
              - { name: label, label: Text, type: string }
              - name: icon
                label: Ikona
                type: select
                options:
                  values:
                    - { value: stimmung, label: Smajlík }
                    - { value: haltung, label: Chrbtica }
                    - { value: immunsystem, label: Štít }
                    - { value: energie, label: Blesk }
                    - { value: stress, label: Pulz }
                    - { value: beweglichkeit, label: Pohyb }
                    - { value: verdauung, label: Trávenie }
                    - { value: herz, label: Srdce }
                    - { value: schlaf, label: Mesiac }
      - name: benefits
        label: Ďalšie výhody
        type: object
        fields:
          - { name: heading, label: Nadpis, type: string }
          - name: items
            label: Výhody
            type: object
            list: true
            fields:
              - { name: image, label: Obrázok, type: image }
              - { name: title, label: Nadpis, type: string }
              - { name: text, label: Text, type: text }
      - name: phases
        label: Tri fázy liečby
        type: object
        fields:
          - { name: heading, label: Nadpis, type: string }
          - { name: quote, label: Citát, type: text }
          - name: items
            label: Fázy
            type: object
            list: true
            fields:
              - { name: label, label: Malý nadpis, type: string }
              - { name: title, label: Nadpis, type: string }
              - { name: text, label: Text, type: text }
      - name: faq
        label: Časté otázky (FAQ)
        type: object
        fields:
          - { name: heading, label: Nadpis, type: string }
          - name: items
            label: Otázky
            type: object
            list: true
            fields:
              - { name: question, label: Otázka, type: string }
              - { name: answer, label: Odpoveď, type: rich-text }
      - name: videos
        label: Videá
        type: object
        fields:
          - name: items
            label: Videá
            type: object
            list: true
            fields:
              - { name: url, label: Odkaz na video (YouTube/Vimeo), type: string }
              - { name: image, label: Náhľadový obrázok, type: image }
              - { name: title, label: Nadpis, type: string }
          - { name: link_label, label: Text odkazu pod videami, type: string }
          - { name: link_url, label: Odkaz pod videami, type: string }

  # ------------------------------------------------------------------ Chiropraktik
  - name: chiropraktik
    label: Chiropraktik
    type: file
    path: content/chiropraktik.yml
    fields:
      - { name: title, label: Titulok stránky, type: string }
      - { name: description, label: Popis pre Google, type: text }
      - name: hero
        label: Úvodná časť
        type: object
        fields:
          - { name: image, label: Obrázok, type: image }
          - { name: image_alt, label: Obrázok – alternatívny text, type: string }
          - { name: image_position, label: Výrez obrázka, type: string, description: "nepovinné, napr. 50% 30%" }
          - { name: heading, label: Nadpis, type: string }
      - name: philosophie
        label: Philosophie
        type: object
        fields:
          - { name: nav_label, label: Názov v menu sekcií, type: string }
          - { name: intro, label: Úvod, type: text, description: Prvé číslo v texte sa pri skrolovaní napočíta. }
          - { name: text, label: Text, type: text }
          - { name: pillars, label: "Grafika: tri pojmy", type: string, list: { min: 3, max: 3 } }
      - name: vitalistische
        label: Vitalistische Chiropraktik
        type: object
        fields:
          - { name: nav_label, label: Názov v menu sekcií, type: string }
          - { name: heading, label: Nadpis, type: string }
          - { name: lead, label: Úvod, type: text }
          - { name: paragraphs, label: Odseky, type: text, list: true }
          - { name: highlight, label: Zvýraznený odsek, type: text }
      - name: neurologie
        label: Funktionelle Neurologie
        type: object
        fields:
          - { name: nav_label, label: Názov v menu sekcií, type: string }
          - { name: heading, label: Nadpis, type: string }
          - { name: lead, label: Úvod, type: text }
          - { name: paragraphs, label: Odseky, type: text, list: true }
      - name: subluxation
        label: Vertebrale Subluxation
        type: object
        fields:
          - { name: image, label: Obrázok, type: image }
          - { name: image_alt, label: Obrázok – alternatívny text, type: string }
          - { name: heading, label: Nadpis, type: string }
          - { name: lead, label: Úvod, type: text }
          - { name: paragraphs, label: Odseky, type: text, list: true }
      - name: justierung
        label: Justierung
        type: object
        fields:
          - { name: nav_label, label: Názov v menu sekcií, type: string }
          - { name: image, label: Obrázok, type: image }
          - { name: image_alt, label: Obrázok – alternatívny text, type: string }
          - { name: heading, label: Nadpis, type: string }
          - { name: text, label: Text, type: text }

  # ------------------------------------------------------------------ Über Uns
  - name: uber-uns
    label: O nás (Über Uns)
    type: file
    path: content/uber-uns.yml
    fields:
      - { name: title, label: Titulok stránky, type: string }
      - { name: description, label: Popis pre Google, type: text }
      - name: hero
        label: Úvodná časť
        type: object
        fields:
          - { name: image, label: Obrázok, type: image }
          - { name: image_alt, label: Obrázok – alternatívny text, type: string }
          - { name: heading, label: Nadpis, type: text }
          - { name: text, label: Text, type: text }
      - name: people
        label: Tím
        type: object
        list: true
        fields:
          - { name: name, label: Meno, type: string }
          - { name: image, label: Fotka, type: image }
          - { name: image_alt, label: Fotka – alternatívny text, type: string }
          - { name: titles, label: Tituly / kvalifikácie, type: string, list: true }
          - { name: bio_heading, label: Nadpis bia, type: string }
          - { name: bio_lead, label: Úvod bia, type: text }
          - { name: bio, label: Bio, type: rich-text }
          - { name: statement, label: Záverečné vyhlásenie, type: text }

  # ------------------------------------------------------------------ Erfahrungsberichte
  - name: erfahrungsberichte
    label: Recenzie (Erfahrungsberichte)
    type: file
    path: content/erfahrungsberichte.yml
    fields:
      - { name: title, label: Titulok stránky, type: string }
      - { name: description, label: Popis pre Google, type: text }
      - name: hero
        label: Úvodná časť
        type: object
        fields:
          - { name: image, label: Obrázok, type: image }
          - { name: image_alt, label: Obrázok – alternatívny text, type: string }
          - { name: image_position, label: Výrez obrázka, type: string }
          - { name: heading, label: Nadpis, type: string }
      - name: reviews
        label: Recenzie
        description: Zadávaj len skutočné recenzie so súhlasom danej osoby. Kým je zoznam prázdny, sekcia sa na webe nezobrazí.
        type: object
        list: true
        fields:
          - { name: name, label: Meno (napr. krstné meno + iniciála), type: string, required: true }
          - { name: text, label: Recenzia, type: text, required: true }
          - { name: rating, label: Hviezdičky (1–5), type: number, options: { min: 1, max: 5 } }
          - { name: date, label: Dátum, type: string, description: "napr. März 2026 (zobrazí sa na webe, preto po nemecky)" }

  # ------------------------------------------------------------------ Kontakt
  - name: kontakt
    label: Kontakt
    type: file
    path: content/kontakt.yml
    fields:
      - { name: title, label: Titulok stránky, type: string }
      - { name: description, label: Popis pre Google, type: text }
      - name: hero
        label: Úvodná časť
        type: object
        fields:
          - { name: image, label: Obrázok, type: image }
          - { name: image_alt, label: Obrázok – alternatívny text, type: string }
          - { name: heading, label: Nadpis, type: string }
          - { name: text, label: Text, type: text }
      - { name: maps_label, label: Text odkazu na Google Maps, type: string }
      - { name: phone_label, label: Popis pri telefóne, type: string }
      - { name: email_label, label: Popis pri e-maile, type: string }

  # ------------------------------------------------------------------ Právne texty
  - name: impressum
    label: Impressum
    type: file
    path: content/impressum.yml
    fields:
      - { name: title, label: Titulok stránky, type: string }
      - { name: description, label: Popis pre Google, type: text }
      - { name: body, label: Obsah, type: rich-text }

  - name: datenschutz
    label: Ochrana údajov (Datenschutz)
    type: file
    path: content/datenschutz.yml
    fields:
      - { name: title, label: Titulok stránky, type: string }
      - { name: description, label: Popis pre Google, type: text }
      - { name: body, label: Obsah, type: rich-text }

  - name: consent
    label: Cookie lišta
    type: file
    path: content/consent.yml
    fields:
      - { name: title, label: Nadpis, type: string }
      - { name: message, label: Text, type: text }
      - name: functional
        label: Funkčné (Funktional)
        type: object
        fields:
          - { name: label, label: Názov, type: string }
          - { name: always, label: Poznámka „vždy aktívne“, type: string }
          - { name: text, label: Popis, type: text }
      - name: preferences
        label: Preferencie (Vorlieben)
        type: object
        fields:
          - { name: label, label: Názov, type: string }
          - { name: text, label: Popis, type: text }
      - name: statistics
        label: Štatistiky (Statistiken)
        type: object
        fields:
          - { name: label, label: Názov, type: string }
          - { name: text, label: Popis, type: text }
      - name: marketing
        label: Marketing
        type: object
        fields:
          - { name: label, label: Názov, type: string }
          - { name: text, label: Popis, type: text }
      - { name: accept, label: Tlačidlo Prijať, type: string }
      - { name: deny, label: Tlačidlo Odmietnuť, type: string }
      - { name: view, label: Tlačidlo Zobraziť nastavenia, type: string }
      - { name: save, label: Tlačidlo Uložiť nastavenia, type: string }
      - { name: privacy_label, label: Odkaz na Datenschutz, type: string }
      - { name: imprint_label, label: Odkaz na Impressum, type: string }
      - { name: footer_link, label: Odkaz v pätičke, type: string }

  - name: notfound
    label: Stránka nenájdená (404)
    type: file
    path: content/404.yml
    fields:
      - { name: title, label: Titulok stránky, type: string }
      - { name: description, label: Popis, type: text }
      - { name: label, label: Malý nadpis, type: string }
      - { name: heading, label: Nadpis, type: string }
      - { name: home_label, label: Tlačidlo na úvodnú stránku, type: string }
      - { name: contact_label, label: Tlačidlo Kontakt, type: string }
